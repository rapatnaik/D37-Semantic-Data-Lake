[project]
name = "d37-semantic-data-lake"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "tifffile>=2026.3.3",
    "pypdf",
    "python-docx",
    "marimo",
]

[project.scripts]
d37-agent = "agents.investigator.cli:main"

[dependency-groups]
dev = [
    "reportlab>=5.1.0",
]
# Installed only inside the isolated analysis worker image
# (containers/investigator/Dockerfile), not in the local environment.
worker = [
    "numpy>=2.4.6",
    "pandas",
    "pyarrow",
    "matplotlib",
    "pillow",
    "tifffile>=2026.3.3",
    "openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.uv.workspace]
members = []
